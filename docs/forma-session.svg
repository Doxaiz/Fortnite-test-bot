<svg xmlns="http://www.w3.org/2000/svg" width="912" height="604" viewBox="0 0 912 604" role="img" aria-labelledby="title desc">
  <title id="title">Первый экран FORMA — Сеанс</title>
  <desc id="desc">Схема новой панели: состояние окна Fortnite, выбор режима, безопасный DryRun и одна основная кнопка запуска. Не скриншот игры.</desc>
  <style>
    text { font-family: 'Segoe UI', 'DejaVu Sans', sans-serif; fill: #f1f4fb; }
    .title { font-size: 27px; font-weight: 700; }
    .strong { font-weight: 700; }
    .muted { fill: #aeb9cb; font-size: 12px; }
    .accent { fill: #becfff; }
  </style>
  <rect width="912" height="604" rx="12" fill="#141820"/>
  <path d="M12 0h144v604H12a12 12 0 0 1-12-12V12A12 12 0 0 1 12 0z" fill="#11151c"/>
  <path d="M156 0v604M16 225h124M180 70h708M180 442h708" fill="none" stroke="#313b4c"/>
  <text x="20" y="49" font-size="20" class="strong">FORMA</text>
  <rect x="12" y="92" width="132" height="35" rx="6" fill="#26344c" stroke="#313b4c"/>
  <path d="M16 100v19" stroke="#becfff" stroke-width="3"/>
  <text x="27" y="114" font-size="14" class="accent strong">Сеанс</text>
  <text x="27" y="158" font-size="14">Настройки</text>
  <text x="27" y="202" font-size="12">Проверка запуска</text>
  <text x="27" y="257" font-size="14">Журнал</text>
  <text x="27" y="301" font-size="14">Находки</text>
  <text x="20" y="526" class="muted">Старт / стоп: F8</text>
  <text x="20" y="548" class="muted">Меню: F1</text>
  <text x="180" y="52" class="title">Сеанс</text>
  <rect x="747" y="24" width="141" height="35" rx="6" fill="none" stroke="#ffb1b6"/>
  <text x="817" y="46" text-anchor="middle" font-size="13" style="fill:#ffb1b6">Стоп · Esc</text>

  <rect x="180" y="88" width="708" height="90" rx="12" fill="#1b222d" stroke="#313b4c"/>
  <text x="200" y="125" font-size="17" class="strong">Окно Fortnite не найдено</text>
  <text x="200" y="153" class="muted">Запустите саму игру: окна Epic Games Launcher недостаточно.</text>
  <rect x="710" y="111" width="160" height="36" rx="6" fill="#252f3d" stroke="#313b4c"/>
  <text x="790" y="134" text-anchor="middle" font-size="12" class="strong">Открыть проверку</text>

  <rect x="180" y="194" width="708" height="237" rx="12" fill="#1b222d" stroke="#313b4c"/>
  <text x="200" y="227" font-size="14" class="strong">Режим работы</text>
  <rect x="200" y="237" width="360" height="26" rx="3" fill="#151b24" stroke="#313b4c"/>
  <text x="211" y="255" font-size="13">Авто-игра (Zero Build)</text>
  <path d="m538 248 5 5 5-5" fill="none" stroke="#aeb9cb" stroke-width="1.5"/>
  <text x="200" y="288" class="muted">Запускает очередь и управляет персонажем в матче Zero Build.</text>
  <rect x="200" y="315" width="15" height="15" rx="2" fill="#4862cf"/>
  <path d="m203 322 3 3 6-6" fill="none" stroke="#fff" stroke-width="1.6"/>
  <text x="222" y="328" font-size="14" class="strong">Только проверка (DryRun)</text>
  <text x="222" y="355" class="muted">Клавиши и клики не отправляются.</text>
  <rect x="200" y="378" width="212" height="37" rx="6" fill="#4862cf"/>
  <text x="306" y="402" text-anchor="middle" font-size="14" class="strong">Начать проверку</text>

  <text x="180" y="474" font-size="17" class="strong">Сеанс не запущен</text>
