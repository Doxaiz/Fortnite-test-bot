name: Portable Windows build

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
  workflow_dispatch:
    inputs:
      expected_tag:
        description: 'Optional vX.Y.Z to check against the selected ref; does not create a tag'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: portable-${{ github.ref }}
  cancel-in-progress: true

jobs:
  portable:
    name: Pack and smoke-test Windows x64
    runs-on: windows-2022
    timeout-minutes: 12
    env:
      FORMA_EXPECTED_TAG: ${{ github.ref_type == 'tag' && github.ref_name || inputs.expected_tag }}
    steps:
      - name: Check out sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Test wrong-tag rejection before downloads
        if: ${{ env.FORMA_EXPECTED_TAG == '' }}
        id: tag_gate
        shell: pwsh
        run: |
          $tag = .\tests\portable_release_tag.ps1
          "tag=$tag" >> $env:GITHUB_OUTPUT
      - name: Build with the expected tag and test startup and upgrade
        shell: pwsh
        env:
          FORMA_TEST_TAG: ${{ steps.tag_gate.outputs.tag }}
        run: |
          $tag = if ($env:FORMA_EXPECTED_TAG) { $env:FORMA_EXPECTED_TAG } else { $env:FORMA_TEST_TAG }
          .\tools\build-portable.ps1 -SmokeTest -ExpectedTag $tag
      - name: Save verified portable package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ env.FORMA_EXPECTED_TAG != '' && format('FORMA-{0}-windows-x64', env.FORMA_EXPECTED_TAG) || 'FORMA-portable-windows-x64' }}
          path: |
            dist/portable/FORMA-v*-windows-x64.zip
            dist/portable/AutoHotkey-v*-source.zip
            dist/portable/SHA256SUMS.txt
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
