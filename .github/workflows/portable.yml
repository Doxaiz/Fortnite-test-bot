name: Portable Windows build

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
  workflow_dispatch:
    inputs:
      expected_tag:
        description: 'vX.Y.Z to check against the selected ref (required for draft staging)'
        required: false
        type: string
      stage_draft:
        description: 'On main only: attach verified files to an existing draft at this commit; never publish'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: portable-${{ github.ref }}${{ inputs.stage_draft && '-stage' || '' }}
  cancel-in-progress: ${{ !inputs.stage_draft }}

jobs:
  portable:
    name: Pack and smoke-test Windows x64
    runs-on: windows-2022
    timeout-minutes: 12
    outputs:
      artifact_id: ${{ steps.package.outputs.artifact-id }}
    env:
      FORMA_EXPECTED_TAG: ${{ github.ref_type == 'tag' && github.ref_name || inputs.expected_tag }}
    steps:
      - name: Check out sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Test wrong-tag rejection before downloads
        if: ${{ env.FORMA_EXPECTED_TAG == '' }}
        id: tag_gate
        shell: pwsh
        run: |
          $tag = .\tests\portable_release_tag.ps1
          "tag=$tag" >> $env:GITHUB_OUTPUT
      - name: Build with the expected tag and test Rust, fallback and upgrades
        shell: pwsh
        env:
          FORMA_TEST_TAG: ${{ steps.tag_gate.outputs.tag }}
        run: |
          $tag = if ($env:FORMA_EXPECTED_TAG) { $env:FORMA_EXPECTED_TAG } else { $env:FORMA_TEST_TAG }
          try {
            .\tools\build-portable.ps1 -SmokeTest -ExpectedTag $tag
          } catch {
            $message = $_.Exception.Message.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
            Write-Output "::error title=Portable build failed::$message"
            throw
          }
      - name: Save verified portable package
        id: package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ env.FORMA_EXPECTED_TAG != '' && format('FORMA-{0}-windows-x64', env.FORMA_EXPECTED_TAG) || 'FORMA-portable-windows-x64' }}
          path: |
            dist/portable/FORMA-v*-windows-x64.zip
            dist/portable/AutoHotkey-v*-source.zip
            dist/portable/SHA256SUMS.txt
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  stage-draft:
    name: Stage and verify the draft assets
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.stage_draft
    needs: portable
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write # Upload to the existing draft; no writes in pull_request or tag runs.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.portable.outputs.artifact_id }}
          path: ${{ runner.temp }}/forma-verified
          merge-multiple: true
          digest-mismatch: error
      - name: Check manifest, upload missing files and download them back
        env:
          GH_TOKEN: ${{ github.token }}
          FORMA_EXPECTED_TAG: ${{ inputs.expected_tag }}
        run: bash tools/stage-portable-release.sh "$FORMA_EXPECTED_TAG" "$RUNNER_TEMP/forma-verified"
